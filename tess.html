    <!-- Kotak Form Kontak -->
    <section class="kartu">
        <h2>Hubungi Saya</h2>
        <p>Jika ada keperluan dengan kami mohon mengisi form dibawah ini!</p>
        
        <form>
            <label>Nama:</label><br>
            <input type="text" id="nama" name="nama" required><br><br>        

            <label>Keperluan:</label><br>
            <select id="Keperluan" name="keperluan">
                <option value="">pilih keperluan</option>
                <option value="bertanya">bertanya</option>    
                <option value="kerjasama">bekerja sama</option>
                <option value="lainnya">lainnya</option>
            </select><br><br>

            <label>Nomor Telepon:</label><br>
            <input type="tel" id="nomer" name="nomer" placeholder="contoh 082343687653" required><br><br>

            <label>Email:</label><br>
            <input type="email" id="email" name="email" placeholder="contoh@gmail.com" required><br><br>

            <label>Pesan:</label><br>
            <textarea id="pesan" name="pesan" rows="4" placeholder="tulis pesanmu"></textarea><br><br>

            <button type="submit">Kirim Pesan</button>
        </form>
    </section>

</body>
