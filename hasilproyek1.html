<!DOCTYPE html>
<html lang="id">

<head>
    <title>hitung sisa saldo</title>
</head>
<body>
    <!--tanggal pembuatan-->
    <P><h4>10 Agustus, 2026</h4></P>
    <!--judul-->
    <h1><center>PROGRAM UNTUK MENGHITUNG SALDO AKHIR</center></h1>

    <script>
        document.write("<br/>")
        document.write("<h3><ul>Saldo Awal ");
        // pengisian nilai
        var score = 200.000
        document.write("= "+ score + "<br/>");

        // pengisian dan pengurangan 23.000
        score -= 23.000;
        document.write("Membeli makanan seharaga 23.000. Saldo = "+ score + "<br/>");

        // pengisian dan pengurangan 60.000
        score -= 60.000;
        document.write("Memebeli 3 jenis minuman 1 minuman seharaga 20.000. Saldo = "+ score + "<br/>");

        // penisian dan penjumlahan 15.000
        score += 15.000
        document.write("Mendapatkan diskon sebesar 15.000. Saldo = "+ score + "<br/>");

        // pengisian dan pengurangan 20.000
        score -= 20.000
        document.write("Membeli pulsa seharaga 20.000. Saldo akhir = "+ score + "<br/>");

        // pengisian dan perkalian 2
        score *= 2;
        document.write("Lipat gandakan saldo akhir = "+ score + "<br/>");
    </script>
</body>
</html>
